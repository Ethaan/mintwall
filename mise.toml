# Dev tasks. `mise tasks` lists them, `mise run <name>` runs one.
# Tasks run through cmd.exe and wrap the existing .bat scripts.

[tasks.build]
description = "Build server/avesta74.exe (first run compiles all vcpkg deps, slow)"
run = "server\\build.bat"

[tasks.start-server]
description = "Run the dev server in this terminal (127.0.0.1:7171, Ctrl+C to stop)"
run = "powershell -ExecutionPolicy Bypass -File tools/dev-server.ps1 start"

[tasks.stop-server]
description = "Stop the dev server only - test servers keep running (log characters out first)"
run = "powershell -ExecutionPolicy Bypass -File tools/dev-server.ps1 stop"

[tasks.restart-server]
description = "Stop the dev server, if running, and start it again in this terminal"
run = "powershell -ExecutionPolicy Bypass -File tools/dev-server.ps1 restart"

[tasks.seed]
description = "Create server/db.db3 from sql/schema.sqlite + sql/seed.sql (fails if it exists)"
run = "server\\init-db.bat"

[tasks.reseed]
description = "Delete server/db.db3 and recreate it from the seed (wipes all characters; stop the server first)"
confirm = "Delete server/db.db3 and every character in it?"
dir = "{{config_root}}/server"
run = "(if exist db.db3 del db.db3) && init-db.bat"

[tasks.build-client]
description = "Build mintwall.dll and write client/Tibia740/Tibia-mintwall.exe (close the client first)"
run = [
  "client-mod\\build.bat",
  "powershell -ExecutionPolicy Bypass -File tools\\patch-client.ps1",
]

[tasks.test-client]
description = "Test mintwall.dll's walking logic against a model of the 7.4 client (no client needed)"
run = "client-mod\test.bat"

[tasks.walk-trace]
description = "Stop the dev server first. Logging proxy on 7171 that times every step of the real client"
run = "tests\\.venv\\Scripts\\python.exe tools\\walk-trace.py"

[tasks.test]
description = "Gameplay tests on an isolated server (port 7181); extra args go to pytest, e.g. -k oracle"
run = "tests\\run-tests.bat"
