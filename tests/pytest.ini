[pytest]
pythonpath = .
testpaths = .
# -ra: summary of non-passing tests.
# --dist loadscope: only takes effect with -n. Keeps every test of one module on the same xdist worker, so
#   module-scoped fixtures (e.g. the one server in test_server_save.py / test_save_on_close.py) and in-file test
#   ordering are preserved while modules are spread across workers. Each worker gets its own server (server.py
#   derives port/run dir from PYTEST_XDIST_WORKER). Run parallel with: pytest -n 4  (see mise task "test-parallel").
addopts = -ra --dist loadscope
